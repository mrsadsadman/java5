<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section})}">

<head>
    <title>Dashboard Admin</title>
</head>

<body>
    <section>
        <div class="container-fluid py-4">

            <h1 class="fw-bold mb-4 d-flex align-items-center gap-2">
                <i class="fas fa-gauge-high text-primary"></i>
                Bảng điều khiển
            </h1>

            <div class="row g-4">

                <!-- Total Products -->
                <div class="col-md-3">
                    <div class="card shadow-sm border-0 bg-primary text-white rounded-4">
                        <div class="card-body">
                            <h6 class="card-title">Tổng sản phẩm</h6>
                            <p class="display-6 fw-bold mb-0" th:text="${totalProducts ?: 0}">0</p>
                        </div>
                    </div>
                </div>

                <!-- Total Orders -->
                <div class="col-md-3">
                    <div class="card shadow-sm border-0 bg-success text-white rounded-4">
                        <div class="card-body">
                            <h6 class="card-title">Tổng đơn hàng</h6>
                            <p class="display-6 fw-bold mb-0" th:text="${totalOrders ?: 0}">0</p>
                        </div>
                    </div>
                </div>

                <!-- Total Users -->
                <div class="col-md-3">
                    <div class="card shadow-sm border-0 bg-warning text-white rounded-4">
                        <div class="card-body">
                            <h6 class="card-title">Tổng người dùng</h6>
                            <p class="display-6 fw-bold mb-0" th:text="${totalUsers ?: 0}">0</p>
                        </div>
                    </div>
                </div>

                <!-- Total Revenue -->
                <div class="col-md-3">
                    <div class="card shadow-sm border-0 bg-info text-white rounded-4">
                        <div class="card-body">
                            <h6 class="card-title">Doanh thu</h6>
                            <p class="display-6 fw-bold mb-0"
                                th:text="${#numbers.formatDecimal(totalRevenue ?: 0, 0, 'COMMA', 0, 'POINT')} + ' ₫'">
                                0 ₫
                            </p>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </section>
</body>

</html>
