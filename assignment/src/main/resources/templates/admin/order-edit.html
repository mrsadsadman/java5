<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section})}">

<head>
    <title>Edit Order - Admin</title>
</head>

<body>
    <section>
        <div th:fragment="content">
            <h1 class="mb-4"><i class="fas fa-edit"></i> Edit Order #[[${order.id}]]</h1>

            <div class="card">
                <div class="card-header bg-primary text-white">Update Order Status</div>
                <div class="card-body">
                    <form th:action="@{/admin/order/update}" method="post" th:object="${order}">
                        <input type="hidden" name="id" th:value="*{id}">
                        <div class="mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-control" id="status" name="status">
                                <option value="Pending" th:selected="*{status == 'Pending'}">Pending</option>
                                <option value="Confirmed" th:selected="*{status == 'Confirmed'}">Confirmed</option>
                                <option value="Shipped" th:selected="*{status == 'Shipped'}">Shipped</option>
                                <option value="Delivered" th:selected="*{status == 'Delivered'}">Delivered</option>
                                <option value="Cancelled" th:selected="*{status == 'Cancelled'}">Cancelled</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Update Status</button>
                        <a th:href="@{/admin/order/index}" class="btn btn-secondary">Back</a>
                    </form>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
