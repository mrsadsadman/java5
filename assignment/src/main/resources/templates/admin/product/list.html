<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">

<div th:fragment="content">

    <h3 class="mb-3">Product Management</h3>

    <!-- SEARCH + FILTER -->
    <form method="get" th:action="@{/admin/product}" class="row mb-3">

        <div class="col-md-4">
            <input type="text" name="keyword" class="form-control" placeholder="Search product..."
                th:value="${keyword}">
        </div>

        <div class="col-md-3">
            <input type="number" name="categoryId" class="form-control" placeholder="Category ID"
                th:value="${categoryId}">
        </div>

        <div class="col-md-3">
            <button class="btn btn-primary">
                <i class="fa fa-search"></i> Search
            </button>
            <a th:href="@{/admin/product}" class="btn btn-secondary">Reset</a>
        </div>

        <div class="col-md-2 text-end">
            <a th:href="@{/admin/product/create}" class="btn btn-success">
                <i class="fa fa-plus"></i> New
            </a>
        </div>

    </form>


    <!-- TABLE -->
    <table class="table table-bordered table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price</th>
                <th>Discount</th>
                <th>Category</th>
                <th width="160">Action</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="p : ${page.content}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.name}"></td>
                <td th:text="${p.price}"></td>
                <td th:text="${p.discount}"></td>
                <td th:text="${p.category != null ? p.category.name : ''}"></td>

                <td>
                    <a th:href="@{/admin/product/edit/{id}(id=${p.id})}" class="btn btn-sm btn-warning">
                        Edit
                    </a>

                    <a th:href="@{/admin/product/delete/{id}(id=${p.id})}" class="btn btn-sm btn-danger"
                        onclick="return confirm('Delete this product?')">
                        Delete
                    </a>
                </td>
            </tr>
        </tbody>
    </table>


    <!-- PAGINATION -->
    <nav>
        <ul class="pagination">

            <li class="page-item" th:classappend="${page.first}? 'disabled'">
                <a class="page-link"
                    th:href="@{/admin/product(page=${page.number-1},keyword=${keyword},categoryId=${categoryId})}">
                    Previous
                </a>
            </li>

            <li class="page-item" th:each="i : ${#numbers.sequence(0,page.totalPages-1)}"
                th:classappend="${i==page.number}? 'active'">

                <a class="page-link" th:text="${i+1}"
                    th:href="@{/admin/product(page=${i},keyword=${keyword},categoryId=${categoryId})}">
                </a>
            </li>

            <li class="page-item" th:classappend="${page.last}? 'disabled'">
                <a class="page-link"
                    th:href="@{/admin/product(page=${page.number+1},keyword=${keyword},categoryId=${categoryId})}">
                    Next
                </a>
            </li>

        </ul>
    </nav>

</div>

</html>
