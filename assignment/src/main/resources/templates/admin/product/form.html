<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">

<div th:fragment="content">

    <h3 th:text="${product.id == null ? 'Create Product' : 'Edit Product'}"></h3>

    <form th:action="@{/admin/product/save}" method="post">

        <input type="hidden" th:field="${product.id}" />

        <div class="mb-3">
            <label>Name</label>
            <input type="text" class="form-control" th:field="${product.name}" required>
        </div>

        <div class="mb-3">
            <label>Price</label>
            <input type="number" step="0.01" class="form-control" th:field="${product.price}">
        </div>

        <div class="mb-3">
            <label>Discount</label>
            <input type="number" step="0.01" class="form-control" th:field="${product.discount}">
        </div>

        <div class="mb-3">
            <label>Description</label>
            <textarea class="form-control" th:field="${product.description}"></textarea>
        </div>

        <div class="mb-3">
            <label>Category ID</label>
            <input type="number" class="form-control" th:field="${product.category.id}">
        </div>

        <button class="btn btn-success">Save</button>
        <a th:href="@{/admin/product}" class="btn btn-secondary">Back</a>

    </form>

</div>

</html>
