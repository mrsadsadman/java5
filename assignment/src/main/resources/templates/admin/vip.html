<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section})}">

<head>
    <title>VIP Customers - Admin</title>
</head>

<body>
    <section>
        <div th:fragment="content">
            <h1 class="mb-4"><i class="fas fa-crown"></i> Top 10 VIP Customers</h1>

            <div class="card">
                <div class="card-header bg-primary text-white">Customer List</div>
                <div class="card-body">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Customer Name</th>
                                <th>Total Spent</th>
                                <th>First Purchase</th>
                                <th>Last Purchase</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="row : ${vips}">
                                <td th:text="${row[0]}">Name</td>
                                <td th:text="${#numbers.formatDecimal(row[1], 1, 'COMMA', 2, 'POINT')} + ' VND'">Total
                                </td>
                                <td th:text="${#dates.format(row[2], 'dd/MM/yyyy')}">First</td>
                                <td th:text="${#dates.format(row[3], 'dd/MM/yyyy')}">Last</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
