<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section})}">

<head>
    <title>Manage Categories - Admin</title>
</head>

<body>
    <section>
        <div th:fragment="content">
            <h1 class="mb-4"><i class="fas fa-tags"></i> Category Management</h1>

            <div class="row">
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0">Add/Edit Category</h5>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/admin/category/create}" method="post" th:object="${category}">
                                <input type="hidden" name="id" th:value="*{id}">
                                <div class="mb-3">
                                    <label for="name" class="form-label">Category Name</label>
                                    <input type="text" class="form-control" id="name" name="name" th:value="*{name}"
                                        required>
                                </div>
                                <div class="mb-3">
                                    <label for="description" class="form-label">Description</label>
                                    <textarea class="form-control" id="description" name="description" rows="2"
                                        th:text="*{description}"></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save</button>
                                <a th:href="@{/admin/category/index}" class="btn btn-secondary">Reset</a>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-header bg-dark text-white">
                            <h5 class="mb-0">Category List</h5>
                        </div>
                        <div class="card-body">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Name</th>
                                        <th>Description</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="cat : ${categories}">
                                        <td>[[${cat.id}]]</td>
                                        <td>[[${cat.name}]]</td>
                                        <td>[[${cat.description}]]</td>
                                        <td>
                                            <a th:href="@{/admin/category/edit/{id}(id=${cat.id})}"
                                                class="btn btn-sm btn-warning"><i class="fas fa-edit"></i></a>
                                            <a th:href="@{/admin/category/delete/{id}(id=${cat.id})}"
                                                class="btn btn-sm btn-danger"
                                                onclick="return confirm('Are you sure?')"><i
                                                    class="fas fa-trash"></i></a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <!-- Pagination -->
                            <nav th:if="${totalPages > 1}">
                                <ul class="pagination">
                                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                        <a class="page-link"
                                            th:href="@{/admin/category/index(page=${currentPage-1})}">Previous</a>
                                    </li>
                                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages-1)}"
                                        th:classappend="${i == currentPage} ? 'active'">
                                        <a class="page-link" th:href="@{/admin/category/index(page=${i})}"
                                            th:text="${i+1}">1</a>
                                    </li>
                                    <li class="page-item" th:classappend="${currentPage == totalPages-1} ? 'disabled'">
                                        <a class="page-link"
                                            th:href="@{/admin/category/index(page=${currentPage+1})}">Next</a>
                                    </li>
                                </ul>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
