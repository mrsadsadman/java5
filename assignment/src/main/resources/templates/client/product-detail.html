<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section})}">

<head>
    <title th:text="${product.name}">Product Detail</title>
</head>

<body>
    <section>
        <div th:fragment="content">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
                    <li class="breadcrumb-item"><a
                            th:href="@{/product/list-by-category/{id}(id=${product.category.id})}"
                            th:text="${product.category.name}">Category</a></li>
                    <li class="breadcrumb-item active" th:text="${product.name}">Product</li>
                </ol>
            </nav>

            <div class="row">
                <div class="col-md-6">
                    <div
                        style="height:200px; display:flex; align-items:center; justify-content:center; background:#f8f9fa; position:relative;">

                        <!-- Image -->
                        <img th:if="${product.image != null and product.image != ''}" th:src="${product.image}"
                            class="img-fluid" style="max-height:100%; object-fit:cover;"
                            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">

                        <!-- Icon fallback -->
                        <div th:if="${product.image != null and product.image != ''}"
                            style="display:none; align-items:center; justify-content:center; position:absolute; inset:0;">
                            <i class="fa-solid fa-box-open fa-3x text-secondary"></i>
                        </div>

                        <!-- Icon when image is null -->
                        <i th:if="${product.image == null or product.image == ''}"
                            class="fa-solid fa-box-open fa-3x text-secondary"></i>

                    </div>
                </div>
                <div class="col-md-6">
                    <h1 th:text="${product.name}">Product Name</h1>
                    <p class="text-muted" th:text="${product.description}">Description</p>

                    <h3 class="text-danger" th:if="${product.discount > 0}">
                        <span class="text-decoration-line-through text-muted fs-5 me-2"
                            th:text="${#numbers.formatDecimal(product.price, 1, 'COMMA', 2, 'POINT')} + ' VND'">Original</span>
                        <span
                            th:text="${#numbers.formatDecimal(product.price * (1 - product.discount/100), 1, 'COMMA', 2, 'POINT')} + ' VND'">Discounted</span>
                        <span class="badge bg-danger ms-2" th:text="'-' + ${product.discount} + '%'">-10%</span>
                    </h3>
                    <h3 class="text-danger" th:if="${product.discount == 0}"
                        th:text="${#numbers.formatDecimal(product.price, 1, 'COMMA', 2, 'POINT')} + ' VND'">Price</h3>

                    <p><strong>Availability:</strong>
                        <span th:if="${product.quantity > 0}" class="text-success"><i class="fas fa-check-circle"></i>
                            In Stock ([[${product.quantity}]])</span>
                        <span th:if="${product.quantity <= 0}" class="text-danger"><i class="fas fa-times-circle"></i>
                            Out of Stock</span>
                    </p>

                    <div class="d-flex gap-2">
                        <a th:href="@{/cart/add/{id}(id=${product.id})}" class="btn btn-success btn-lg"
                            th:if="${product.quantity > 0}">
                            <i class="fas fa-cart-plus"></i> Add to Cart
                        </a>
                        <a th:href="@{/cart/add/{id}(id=${product.id})}"
                            class="btn btn-outline-secondary btn-lg disabled" th:if="${product.quantity <= 0}">
                            <i class="fas fa-cart-plus"></i> Out of Stock
                        </a>
                    </div>
                </div>
            </div>

            <!-- Related products -->
            <h3 class="mt-5">Related Products</h3>
            <div class="row row-cols-1 row-cols-md-4 g-4">
                <div class="col" th:each="rel : ${relatedProducts}">
                    <div class="card h-100">
                        <div
                            style="height:200px; display:flex; align-items:center; justify-content:center; background:#f8f9fa; position:relative;">

                            <!-- Image -->
                            <img th:if="${product.image != null and product.image != ''}" th:src="${product.image}"
                                class="img-fluid" style="max-height:100%; object-fit:cover;"
                                onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">

                            <!-- Icon fallback -->
                            <div th:if="${product.image != null and product.image != ''}"
                                style="display:none; align-items:center; justify-content:center; position:absolute; inset:0;">
                                <i class="fa-solid fa-box-open fa-3x text-secondary"></i>
                            </div>

                            <!-- Icon when image is null -->
                            <i th:if="${product.image == null or product.image == ''}"
                                class="fa-solid fa-box-open fa-3x text-secondary"></i>

                        </div>
                        <div class="card-body">
                            <h6 class="card-title" th:text="${rel.name}">Product</h6>
                            <p class="card-text text-danger"
                                th:text="${#numbers.formatDecimal(rel.price * (1 - rel.discount/100), 1, 'COMMA', 2, 'POINT')} + ' VND'">
                                Price</p>
                        </div>
                        <div class="card-footer bg-white border-0">
                            <a th:href="@{/product/detail/{id}(id=${rel.id})}"
                                class="btn btn-sm btn-outline-primary w-100">View</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
