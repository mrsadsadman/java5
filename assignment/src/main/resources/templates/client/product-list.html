<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section})}">

<head>
    <title>Products - ABC Shop</title>
</head>

<body>
    <section>
        <div th:fragment="content">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
                    <li class="breadcrumb-item active" th:if="${category != null}" th:text="${category.name}">Category
                    </li>
                    <li class="breadcrumb-item active" th:if="${keyword != null}">Search: [[${keyword}]]</li>
                </ol>
            </nav>

            <div class="row">
                <!-- Sidebar filters (optional) -->
                <div class="col-md-3">
                    <div class="card mb-4">
                        <div class="card-header bg-primary text-white">
                            <i class="fas fa-filter"></i> Filter
                        </div>
                        <div class="card-body">
                            <form th:action="@{/product/search}" method="get">
                                <div class="input-group">
                                    <input type="text" class="form-control" name="keyword" th:value="${keyword}"
                                        placeholder="Search...">
                                    <button class="btn btn-primary" type="submit"><i class="fas fa-search"></i></button>
                                </div>
                            </form>
                            <hr>
                            <h6>Categories</h6>
                            <ul class="list-unstyled">
                                <li th:each="cat : ${@categoryService.findAll()}">
                                    <a th:href="@{/product/list-by-category/{id}(id=${cat.id})}" th:text="${cat.name}"
                                        class="text-decoration-none">Category</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- Product grid -->
                <div class="col-md-9">
                    <div class="row row-cols-1 row-cols-md-3 g-4">
                        <div class="col" th:each="product : ${products}">
                            <div class="card h-100 shadow-sm">
                                <div
                                    style="height:200px; display:flex; align-items:center; justify-content:center; background:#f8f9fa; position:relative;">

                                    <!-- Image -->
                                    <img th:if="${product.image != null and product.image != ''}"
                                        th:src="${product.image}" class="img-fluid"
                                        style="max-height:100%; object-fit:cover;"
                                        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">

                                    <!-- Icon fallback -->
                                    <div th:if="${product.image != null and product.image != ''}"
                                        style="display:none; align-items:center; justify-content:center; position:absolute; inset:0;">
                                        <i class="fa-solid fa-box-open fa-3x text-secondary"></i>
                                    </div>

                                    <!-- Icon when image is null -->
                                    <i th:if="${product.image == null or product.image == ''}"
                                        class="fa-solid fa-box-open fa-3x text-secondary"></i>

                                </div>
                                <div class="card-body">
                                    <h5 class="card-title" th:text="${product.name}">Product Name</h5>
                                    <p class="card-text text-danger fw-bold"
                                        th:text="${#numbers.formatDecimal(product.price * (1 - product.discount/100), 1, 'COMMA', 2, 'POINT')} + ' VND'">
                                        Price</p>
                                </div>
                                <div class="card-footer bg-white border-0 d-flex justify-content-between">
                                    <a th:href="@{/product/detail/{id}(id=${product.id})}"
                                        class="btn btn-sm btn-outline-primary">Details</a>
                                    <a th:href="@{/cart/add/{id}(id=${product.id})}" class="btn btn-sm btn-success"><i
                                            class="fas fa-cart-plus"></i> Add</a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Pagination -->
                    <nav class="mt-4" th:if="${totalPages > 1}">
                        <ul class="pagination justify-content-center">
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                <a class="page-link"
                                    th:href="@{${#httpServletRequest.requestURI}(page=${currentPage-1}, size=12, keyword=${keyword}, id=${category?.id})}">Previous</a>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages-1)}"
                                th:classappend="${i == currentPage} ? 'active'">
                                <a class="page-link"
                                    th:href="@{${#httpServletRequest.requestURI}(page=${i}, size=12, keyword=${keyword}, id=${category?.id})}"
                                    th:text="${i+1}">1</a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage == totalPages-1} ? 'disabled'">
                                <a class="page-link"
                                    th:href="@{${#httpServletRequest.requestURI}(page=${currentPage+1}, size=12, keyword=${keyword}, id=${category?.id})}">Next</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
