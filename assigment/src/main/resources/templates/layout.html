<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} ?: 'ABC Shop'">ABC Shop</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
    <!-- Font Awesome -->
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.5.1/css/all.min.css}">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <!-- Navigation (same as before) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}"><i class="fas fa-store"></i> ABC Shop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMain">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="categoriesDropdown" role="button"
                            data-bs-toggle="dropdown">Categories</a>
                        <ul class="dropdown-menu" th:if="${@categoryService != null}">
                            <li th:each="cat : ${@categoryService.findAll()}">
                                <a class="dropdown-item" th:href="@{/product/list-by-category/{id}(id=${cat.id})}"
                                    th:text="${cat.name}">Category</a>
                            </li>
                        </ul>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/cart/view}">
                            <i class="fas fa-shopping-cart"></i> Cart
                            <span th:if="${session.cart != null and not session.cart.isEmpty()}" class="badge bg-danger"
                                th:text="${session.cart.size()}"></span>
                        </a>
                    </li>
                    <!-- User dropdown / login/register links -->
                    <li class="nav-item dropdown" th:if="${session.user != null}">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                            data-bs-toggle="dropdown">
                            <i class="fas fa-user"></i> [[${session.user.fullname}]]
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" th:href="@{/account/edit-profile}"><i
                                        class="fas fa-id-card"></i> Profile</a></li>
                            <li><a class="dropdown-item" th:href="@{/order/list}"><i class="fas fa-box"></i> My
                                    Orders</a></li>
                            <li><a class="dropdown-item" th:href="@{/order/my-product-list}"><i
                                        class="fas fa-cubes"></i> My Products</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" th:href="@{/auth/logout}"><i class="fas fa-sign-out-alt"></i>
                                    Logout</a></li>
                        </ul>
                    </li>
                    <li class="nav-item" th:if="${session.user == null}">
                        <a class="nav-link" th:href="@{/auth/login}"><i class="fas fa-sign-in-alt"></i> Login</a>
                    </li>
                    <li class="nav-item" th:if="${session.user == null}">
                        <a class="nav-link" th:href="@{/account/sign-up}"><i class="fas fa-user-plus"></i> Register</a>
                    </li>
                    <li class="nav-item" th:if="${session.user != null and session.user.role.name == 'ADMIN'}">
                        <a class="nav-link" th:href="@{/admin/category/index}"><i class="fas fa-cog"></i> Admin</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main content area where the child's content will be inserted -->
    <main class="container my-4">
        <div th:replace="${content}"></div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2026 ABC Shop. All rights reserved.</p>
        </div>
    </footer>

    <script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>
</body>

</html>
