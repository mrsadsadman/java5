<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section})}">

<head>
    <title>Manage Orders - Admin</title>
</head>

<body>
    <section>
        <div th:fragment="content">
            <h1 class="mb-4"><i class="fas fa-truck"></i> Order Management</h1>

            <div class="card">
                <div class="card-header bg-dark text-white">
                    <h5 class="mb-0">Order List</h5>
                </div>
                <div class="card-body">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Customer</th>
                                <th>Date</th>
                                <th>Total</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="order : ${orders}">
                                <td>#[[${order.id}]]</td>
                                <td>[[${order.account.fullname}]]</td>
                                <td>[[${#dates.format(order.orderDate, 'dd/MM/yyyy HH:mm')}]]</td>
                                <td>[[${#numbers.formatDecimal(order.totalAmount, 1, 'COMMA', 2, 'POINT')}]]</td>
                                <td>
                                    <span class="badge" th:classappend="${order.status == 'Pending'} ? 'bg-warning' : 
                                        ${order.status == 'Confirmed'} ? 'bg-info' : 
                                        ${order.status == 'Shipped'} ? 'bg-primary' : 
                                        ${order.status == 'Delivered'} ? 'bg-success' : 'bg-secondary'"
                                        th:text="${order.status}">Status</span>
                                </td>
                                <td>
                                    <a th:href="@{/admin/order/edit/{id}(id=${order.id})}"
                                        class="btn btn-sm btn-warning"><i class="fas fa-edit"></i></a>
                                    <a th:href="@{/admin/order/delete/{id}(id=${order.id})}"
                                        class="btn btn-sm btn-danger" onclick="return confirm('Are you sure?')"><i
                                            class="fas fa-trash"></i></a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <!-- Pagination -->
                    <nav th:if="${totalPages > 1}">
                        <ul class="pagination">
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                <a class="page-link" th:href="@{/admin/order/index(page=${currentPage-1})}">Previous</a>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages-1)}"
                                th:classappend="${i == currentPage} ? 'active'">
                                <a class="page-link" th:href="@{/admin/order/index(page=${i})}" th:text="${i+1}">1</a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage == totalPages-1} ? 'disabled'">
                                <a class="page-link" th:href="@{/admin/order/index(page=${currentPage+1})}">Next</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
