<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section})}">

<head>
    <title>Revenue by Category - Admin</title>
</head>

<body>
    <section>
        <div th:fragment="content">
            <h1 class="mb-4"><i class="fas fa-chart-bar"></i> Revenue by Category</h1>

            <div class="card">
                <div class="card-header bg-primary text-white">Statistics</div>
                <div class="card-body">
                    <table class="table table-bordered">
                        <thead>
                            <tr>
                                <th>Category</th>
                                <th>Total Revenue</th>
                                <th>Total Quantity</th>
                                <th>Max Price</th>
                                <th>Min Price</th>
                                <th>Avg Price</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="row : ${reports}">
                                <td th:text="${row[0]}">Category</td>
                                <td th:text="${#numbers.formatDecimal(row[1], 1, 'COMMA', 2, 'POINT')} + ' VND'">Revenue
                                </td>
                                <td th:text="${row[2]}">Quantity</td>
                                <td th:text="${#numbers.formatDecimal(row[3], 1, 'COMMA', 2, 'POINT')} + ' VND'">Max
                                </td>
                                <td th:text="${#numbers.formatDecimal(row[4], 1, 'COMMA', 2, 'POINT')} + ' VND'">Min
                                </td>
                                <td th:text="${#numbers.formatDecimal(row[5], 1, 'COMMA', 2, 'POINT')} + ' VND'">Avg
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
