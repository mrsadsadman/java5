<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section})}">

<head>
    <title>Forgot Password - ABC Shop</title>
</head>

<body>
    <section>
        <div th:fragment="content">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header bg-primary text-white">
                            <h4 class="mb-0"><i class="fas fa-question-circle"></i> Forgot Password</h4>
                        </div>
                        <div class="card-body">
                            <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error</div>
                            <div th:if="${message}" class="alert alert-success" th:text="${message}">Message</div>

                            <form th:action="@{/account/forgot-password}" method="post">
                                <div class="mb-3">
                                    <label for="email" class="form-label">Enter your email address</label>
                                    <input type="email" class="form-control" id="email" name="email" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Send New Password</button>
                            </form>
                            <hr>
                            <p class="text-center"><a th:href="@{/auth/login}">Back to Login</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
