<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section})}">

<head>
    <title>Register - ABC Shop</title>
</head>

<body>
    <section>
        <div th:fragment="content">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card shadow">
                        <div class="card-header bg-primary text-white">
                            <h4 class="mb-0"><i class="fas fa-user-plus"></i> Register</h4>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/account/sign-up}" method="post" th:object="${account}">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="username" class="form-label">Username *</label>
                                        <input type="text" class="form-control" id="username" th:field="*{username}"
                                            required>
                                        <div class="text-danger" th:if="${#fields.hasErrors('username')}"
                                            th:errors="*{username}"></div>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="fullname" class="form-label">Full Name *</label>
                                        <input type="text" class="form-control" id="fullname" th:field="*{fullname}"
                                            required>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="password" class="form-label">Password *</label>
                                        <input type="password" class="form-control" id="password" th:field="*{password}"
                                            required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="confirm" class="form-label">Confirm Password *</label>
                                        <input type="password" class="form-control" id="confirm" name="confirm"
                                            required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email *</label>
                                    <input type="email" class="form-control" id="email" th:field="*{email}" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="phone" class="form-label">Phone</label>
                                        <input type="tel" class="form-control" id="phone" th:field="*{phone}">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="address" class="form-label">Address</label>
                                        <input type="text" class="form-control" id="address" th:field="*{address}">
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Register</button>
                            </form>
                            <hr>
                            <p class="text-center">Already have an account? <a th:href="@{/auth/login}">Login</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
