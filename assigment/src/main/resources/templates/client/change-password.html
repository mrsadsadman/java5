<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section})}">

<head>
    <title>Change Password - ABC Shop</title>
</head>

<body>
    <section>
        <div th:fragment="content">
            <h1 class="mb-4"><i class="fas fa-key"></i> Change Password</h1>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error</div>
            <div th:if="${message}" class="alert alert-success" th:text="${message}">Message</div>

            <div class="card">
                <div class="card-header bg-primary text-white">Change Password</div>
                <div class="card-body">
                    <form th:action="@{/account/change-password}" method="post">
                        <div class="mb-3">
                            <label for="old" class="form-label">Current Password</label>
                            <input type="password" class="form-control" id="old" name="old" required>
                        </div>
                        <div class="mb-3">
                            <label for="new" class="form-label">New Password</label>
                            <input type="password" class="form-control" id="new" name="new" required>
                        </div>
                        <div class="mb-3">
                            <label for="confirm" class="form-label">Confirm New Password</label>
                            <input type="password" class="form-control" id="confirm" name="confirm" required>
                        </div>
                        <button type="submit" class="btn btn-primary"><i class="fas fa-sync-alt"></i> Change
                            Password</button>
                    </form>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
