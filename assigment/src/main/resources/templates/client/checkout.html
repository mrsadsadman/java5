<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(content=~{::content})}">

<head>
    <title>Checkout - ABC Shop</title>
</head>

<body>

    <div th:fragment="content">

        <h1 class="mb-4">
            <i class="fas fa-credit-card"></i> Checkout
        </h1>

        <div class="row">

            <!-- LEFT SIDE -->
            <div class="col-md-8">

                <form th:action="@{/order/checkout}" method="post">

                    <div class="card">
                        <div class="card-header bg-primary text-white">
                            Delivery Information
                        </div>

                        <div class="card-body">

                            <div class="mb-3">
                                <label class="form-label">Address *</label>
                                <input type="text" class="form-control" name="address" th:value="${user.address}"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Phone *</label>
                                <input type="tel" class="form-control" name="phone" th:value="${user.phone}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Notes</label>
                                <textarea class="form-control" name="notes" rows="3"></textarea>
                            </div>

                        </div>
                    </div>

                    <button class="btn btn-success btn-lg mt-3">
                        <i class="fas fa-check"></i> Place Order
                    </button>

                </form>

            </div>

            <!-- RIGHT SIDE -->
            <div class="col-md-4">

                <div class="card">
                    <div class="card-header bg-secondary text-white">
                        Order Summary
                    </div>

                    <div class="card-body">

                        <p class="fs-5">
                            Total:
                            <span class="float-end fw-bold text-danger"
                                th:text="${#numbers.formatDecimal(total,1,'COMMA',0,'POINT')} + ' VND'">
                                0 VND
                            </span>
                        </p>

                    </div>
                </div>

            </div>

        </div>

    </div>

</body>

</html>
