<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section})}">

<head>
    <title>My Products - ABC Shop</title>
</head>

<body>
    <section>
        <div th:fragment="content">
            <h1 class="mb-4"><i class="fas fa-cubes"></i> My Purchased Products</h1>

            <div th:if="${products.isEmpty()}" class="alert alert-info">You haven't purchased any products yet.</div>

            <div class="row row-cols-1 row-cols-md-4 g-4">
                <div class="col" th:each="product : ${products}">
                    <div class="card h-100">
                        <img th:src="@{'/uploads/' + ${product.image}}" class="card-img-top" alt="Product image"
                            style="height: 150px; object-fit: cover;">
                        <div class="card-body">
                            <h6 class="card-title" th:text="${product.name}">Product</h6>
                        </div>
                        <div class="card-footer bg-white border-0">
                            <a th:href="@{/product/detail/{id}(id=${product.id})}"
                                class="btn btn-sm btn-outline-primary w-100">View Details</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
